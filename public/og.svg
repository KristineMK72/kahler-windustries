    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(900 280) rotate(90) scale(280 320)">
      <stop stop-color="#38bdf8" stop-opacity="0.25"/>
