    <path d="M70 530h80" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
    <circle cx="110" cy="200" r="18" fill="url(#blade)"/>
    <path d="M110 182C125 90 175 55 230 70c-20 70-75 110-120 112z" fill="url(#blade)"/>
    <path d="M125 210C220 230 255 300 240 370c-70-15-120-70-115-160z" fill="url(#blade)" opacity="0.9"/>
